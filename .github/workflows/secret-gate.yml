name: Secret gate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install verified gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          curl --fail --location --proto '=https' --tlsv1.2 -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          python3 - <<'PYCODE'
          import hashlib
          expected='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          assert hashlib.sha256(open('gitleaks.tar.gz','rb').read()).hexdigest()==expected
          PYCODE
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Check tracked index blobs
        run: python3 scripts/secret_gate.py --tracked
